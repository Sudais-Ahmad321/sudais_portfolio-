<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Bus Reservation System illustration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.05)">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <!-- road -->
  <rect x="0" y="380" width="800" height="120" fill="#0f172a"/>
  <rect x="0" y="438" width="800" height="4" fill="#facc15" opacity="0.6"/>
  <!-- bus body -->
  <rect x="130" y="150" width="540" height="200" rx="26" fill="url(#bus)"/>
  <rect x="150" y="172" width="370" height="90" rx="10" fill="url(#glass)"/>
  <!-- seat grid overlay (reservation map) -->
  <g id="seats">
    <g fill="#22c55e">
      <rect x="560" y="172" width="34" height="34" rx="6"/>
      <rect x="600" y="172" width="34" height="34" rx="6"/>
      <rect x="560" y="212" width="34" height="34" rx="6"/>
      <rect x="600" y="212" width="34" height="34" rx="6"/>
    </g>
    <g fill="#ef4444">
      <rect x="520" y="172" width="34" height="34" rx="6"/>
      <rect x="520" y="212" width="34" height="34" rx="6"/>
    </g>
    <g fill="#94a3b8">
      <rect x="480" y="172" width="34" height="34" rx="6"/>
      <rect x="480" y="212" width="34" height="34" rx="6"/>
    </g>
  </g>
  <!-- windows -->
  <rect x="150" y="280" width="370" height="36" rx="8" fill="#7c2d12" opacity="0.35"/>
  <!-- wheels -->
  <circle cx="240" cy="360" r="42" fill="#020617"/>
  <circle cx="240" cy="360" r="18" fill="#94a3b8"/>
  <circle cx="570" cy="360" r="42" fill="#020617"/>
  <circle cx="570" cy="360" r="18" fill="#94a3b8"/>
  <!-- headlight -->
  <rect x="650" y="300" width="20" height="16" rx="4" fill="#fef08a"/>
  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="22" fill="#e2e8f0">
    <circle cx="150" cy="80" r="10" fill="#22c55e"/><text x="170" y="87">Available</text>
    <circle cx="310" cy="80" r="10" fill="#ef4444"/><text x="330" y="87">Booked</text>
    <circle cx="450" cy="80" r="10" fill="#94a3b8"/><text x="470" y="87">Held</text>
  </g>
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#fff">BUS RESERVATION · SEAT MAP</text>
</svg>
