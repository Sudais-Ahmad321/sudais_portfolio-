<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ameer Traskon Restaurant portal illustration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- plate -->
  <circle cx="400" cy="270" r="150" fill="#f8fafc" opacity="0.95"/>
  <circle cx="400" cy="270" r="112" fill="none" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="400" cy="270" r="60" fill="url(#gold)"/>
  <!-- fork and knife -->
  <g fill="#e2e8f0">
    <rect x="150" y="150" width="10" height="240" rx="5"/>
    <rect x="132" y="150" width="6" height="60" rx="3"/>
    <rect x="146" y="150" width="6" height="60" rx="3"/>
    <rect x="160" y="150" width="6" height="60" rx="3"/>
    <rect x="640" y="150" width="10" height="240" rx="5"/>
    <path d="M640 150 Q670 150 670 200 L650 220 L640 220 Z"/>
  </g>
  <!-- menu card -->
  <rect x="560" y="60" width="200" height="140" rx="12" fill="#fef3c7" opacity="0.95"/>
  <g fill="#78350f" font-family="Georgia, serif">
    <text x="580" y="95" font-size="20" font-weight="bold">MENU</text>
    <rect x="580" y="110" width="160" height="4" fill="#b45309"/>
    <text x="580" y="140" font-size="15">Kebab Platter ....... 1200</text>
    <text x="580" y="165" font-size="15">Chicken Karahi ..... 1500</text>
    <text x="580" y="190" font-size="15">Chai ................ 150</text>
  </g>
  <!-- reservation badge -->
  <rect x="40" y="60" width="210" height="60" rx="30" fill="#10b981" opacity="0.9"/>
  <text x="145" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#022c22">Table Reserved ✓</text>
  <text x="400" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#fde68a">AMEER TRASKON · Dine &amp; Book</text>
</svg>
