<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Sudais Ahmad</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(14, 19, 30, 0.9);
      --card-border: rgba(255, 255, 255, 0.09);
      --accent: #2563eb;
      --accent-cyan: #06b6d4;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    .login-icon {
      font-size: 2.6rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-family: 'Fira Code', monospace;
      font-size: 0.74rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .form-control {
      width: 100%;
      background: rgba(7, 9, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 13px 16px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s;
    }
    .form-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.3);
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: #1d4ed8;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }
    .error-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 18px;
      font-family: 'Fira Code', monospace;
    }
    .back-link {
      display: inline-block;
      margin-top: 22px;
      font-family: 'Fira Code', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-icon">🛡️</div>
    <h1 class="login-title">Admin Access</h1>
    <p class="login-desc">Enter admin password to view portfolio inquiries &amp; messages.</p>

    {% if error %}
      <div class="error-banner">❌ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="password">Admin Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autofocus>
      </div>
      <button type="submit" class="btn-submit">Authenticate ⚡</button>
    </form>

    <a href="/" class="back-link">← Return to Portfolio</a>
  </div>

</body>
</html>
